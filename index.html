<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Orbit Supply is a responsive e-commerce catalog with client-side routing and a persistent shopping cart." />
  <title>Orbit Supply</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <a class="skip-link" href="#app">Skip to content</a>
  <header class="site-header">
    <div class="shell nav-row">
      <a class="brand" href="#/" aria-label="Orbit Supply home">ORBIT<span>SUPPLY</span></a>
      <nav aria-label="Primary navigation">
        <a href="#/shop">Shop</a>
        <a href="#/cart" class="cart-link">Cart <span id="cart-count" aria-label="items in cart">0</span></a>
      </nav>
    </div>
  </header>
  <main id="app" class="shell" tabindex="-1"></main>
  <footer class="site-footer"><div class="shell"><p>Orbit Supply - everyday carry for focused work.</p></div></footer>
  <script type="module" src="js/app.js"></script>
</body>
</html>
